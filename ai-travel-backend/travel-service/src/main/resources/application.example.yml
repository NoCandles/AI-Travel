server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: travel-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travel_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ai.travel.entity
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-value: 1
      logic-not-delete-value: 0

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}

tmap:
  key: ${TMAP_KEY:}

pixabay:
  api:
    key: ${PIXABAY_API_KEY:}

wechat:
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

points:
  enabled: ${POINTS_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

